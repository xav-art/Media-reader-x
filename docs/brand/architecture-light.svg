<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
  <title id="t">How Media Reader x opens a file</title>
  <desc id="d">Media Reader x checks each file's content, then hands a read-only handle to a protected helper process in a Windows AppContainer. The helpers decode photos, make thumbnails and check videos. The app checks every reply before it shows the picture, and plays only videos with common codecs.</desc>
  <rect width="960" height="640" rx="2" fill="#d3d9d4"/>
  <g font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif">
    <text x="40" y="70" font-size="32" letter-spacing="-0.6" fill="#212a31">How Media Reader x opens a file</text>
    <text x="40" y="104" font-size="17" fill="#4b5f64">Decoders run in locked-down helper processes. The app shows only what passes its checks.</text>
    <rect x="40" y="140" width="400" height="440" rx="2" fill="#eef1ee" stroke="#b3bdb7"/><text x="64" y="174" font-size="13" letter-spacing="1.6" fill="#4b5f64">MEDIA READER X, YOUR ACCOUNT</text><rect x="64" y="196" width="352" height="80" rx="2" fill="#d3d9d4" stroke="#b3bdb7"/><text x="84" y="230" font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" fill="#4b5f64">01</text><text x="124" y="230" font-size="18" fill="#212a31">Check the content</text><text x="124" y="254" font-size="14" fill="#4b5f64">One decoder per format, chosen by content</text><rect x="64" y="292" width="352" height="80" rx="2" fill="#d3d9d4" stroke="#b3bdb7"/><text x="84" y="326" font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" fill="#4b5f64">02</text><text x="124" y="326" font-size="18" fill="#212a31">Open the file here</text><text x="124" y="350" font-size="14" fill="#4b5f64">The helper gets a read-only handle, no name</text><line x1="92" x2="92" y1="276" y2="292" stroke="#b3bdb7" stroke-width="2"/><rect x="64" y="388" width="352" height="80" rx="2" fill="#d3d9d4" stroke="#b3bdb7"/><text x="84" y="422" font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" fill="#4b5f64">03</text><text x="124" y="422" font-size="18" fill="#212a31">Check every reply</text><text x="124" y="446" font-size="14" fill="#4b5f64">Sizes, pixel formats and text, field by field</text><line x1="92" x2="92" y1="372" y2="388" stroke="#b3bdb7" stroke-width="2"/><rect x="64" y="484" width="352" height="80" rx="2" fill="#d3d9d4" stroke="#b3bdb7"/><text x="84" y="518" font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" fill="#4b5f64">04</text><text x="124" y="518" font-size="18" fill="#212a31">Show or play</text><text x="124" y="542" font-size="14" fill="#4b5f64">Plain text only. Allowed video codecs only</text><line x1="92" x2="92" y1="468" y2="484" stroke="#b3bdb7" stroke-width="2"/><rect x="540" y="140" width="380" height="440" rx="2" fill="#124e66"/><text x="564" y="174" font-size="13" letter-spacing="1.6" fill="#eef1ee">PROTECTED HELPERS, APPCONTAINER</text><rect x="564" y="196" width="332" height="88" rx="2" fill="#0c3a4c"/><text x="584" y="228" font-size="18" fill="#eef1ee">Viewer</text><text x="584" y="252" font-size="14" fill="#9aafb3">LibRaw, libheif, libjxl, Pillow,</text><text x="584" y="272" font-size="14" fill="#9aafb3">psd-tools and Qt SVG decode the photo</text><rect x="564" y="298" width="332" height="88" rx="2" fill="#0c3a4c"/><text x="584" y="330" font-size="18" fill="#eef1ee">Thumbnails</text><text x="584" y="354" font-size="14" fill="#9aafb3">Photo, RAW, PSD, SVG and video</text><text x="584" y="374" font-size="14" fill="#9aafb3">previews for the strip</text><rect x="564" y="400" width="332" height="88" rx="2" fill="#0c3a4c"/><text x="584" y="432" font-size="18" fill="#eef1ee">Video checker, one file each</text><text x="584" y="456" font-size="14" fill="#9aafb3">FFmpeg lists every stream: each must</text><text x="584" y="476" font-size="14" fill="#9aafb3">use one of about 40 common codecs</text><text x="564" y="520" font-size="14" fill="#eef1ee">No access to your files, the network or the screen.</text><text x="564" y="542" font-size="14" fill="#eef1ee">No programs, no clipboard. Own memory limit.</text><line x1="446" x2="530" y1="332" y2="332" stroke="#8f4622" stroke-width="2"/><polygon points="530,332 522,326 522,338" fill="#8f4622"/><text x="490" y="320" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" fill="#4b5f64">handle</text><line x1="534" x2="450" y1="428" y2="428" stroke="#8f4622" stroke-width="2"/><polygon points="450,428 458,422 458,434" fill="#8f4622"/><text x="490" y="416" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" fill="#4b5f64">pixels</text>
    <text x="40" y="616" font-size="13" fill="#4b5f64">Video playback stays in the app, because Qt needs the graphics card. Details: docs/SANDBOX.md</text>
  </g>
</svg>
